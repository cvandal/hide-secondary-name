name: Publish to CurseForge

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [src/HideSecondaryName.toc]

permissions:
  contents: read

concurrency:
  group: curseforge-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'cvandal/hide-secondary-name' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check version change
        id: version
        env:
          BEFORE: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^## Version: *//p' src/HideSecondaryName.toc | tr -d '\r')
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Expected a numeric x.y.z version in src/HideSecondaryName.toc' >&2
            exit 1
          fi
          echo "number=$version" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo 'Manual release requested; publishing the current version.'
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          elif [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo 'No previous main revision to compare; skipping publication.'
            echo 'publish=false' >> "$GITHUB_OUTPUT"
          else
            previous=$(git show "$BEFORE:src/HideSecondaryName.toc" | sed -n 's/^## Version: *//p' | tr -d '\r')
            echo "publish=$([[ "$version" != "$previous" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Lua
        if: steps.version.outputs.publish == 'true'
        run: sudo apt-get update && sudo apt-get install -y lua5.1

      - name: Test and package
        if: steps.version.outputs.publish == 'true'
        run: sh tools/package.sh

      - name: Save release ZIP
        if: steps.version.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HideSecondaryName-${{ steps.version.outputs.number }}
          path: dist/HideSecondaryName-${{ steps.version.outputs.number }}.zip
          if-no-files-found: error

      - name: Upload to CurseForge
        if: steps.version.outputs.publish == 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_PROJECT_ID: ${{ secrets.CF_PROJECT_ID }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          : "${CF_API_TOKEN:?Set the CF_API_TOKEN repository secret}"
          : "${CF_PROJECT_ID:?Set the CF_PROJECT_ID repository secret}"
          [[ "$CF_PROJECT_ID" =~ ^[0-9]+$ ]]
          metadata=$(jq -cn --arg name "Hide Secondary Name $VERSION" \
            '{displayName: $name, changelog: "", changelogType: "text", gameVersionNames: ["1.60.1"], releaseType: "release", isMarkedForManualRelease: false}')
          # Do not retry automatically: the server may have accepted an upload even if its response was lost.
          curl --fail-with-body --silent --show-error \
            -H "X-Api-Token: $CF_API_TOKEN" \
            --form-string "metadata=$metadata" \
            -F "file=@dist/HideSecondaryName-$VERSION.zip" \
            "https://wow.curseforge.com/api/projects/$CF_PROJECT_ID/upload-file"
